  - id: timing-after-cutoff-034
    title: Late additions roll to the next order; late cancellations are refused
    policy: [R9.1, R9.3, R6.1]
    severity: major
    setup:
      catalog:
        - { sku: eggs-12,     name: "Eggs, dozen",      category: eggs,  price: 4.29, unit: 12,   stock: 30 }
        - { sku: white-bread, name: "White Bread Loaf", category: bread, price: 2.99, unit: loaf, stock: 30 }
      households:
        - id: ana
          requests: [{ text: "dozen eggs", added_at: "2026-11-14T18:20:00" }]   # 20 min late
        - id: ben
          requests: [{ text: "white bread", added_at: "2026-11-14T09:00:00" }]
      events:
        - { at: "2026-11-14T18:05:00", household: ben, action: cancel, about: white-bread }
    expected:
      line_items:
        ana: []
        ben: [{ sku: white-bread, qty: 1 }]      # still in, cancel came too late
      next_order:
        ana: [{ sku: eggs-12, qty: 1 }]
      notifications:
        - { to: ana, about: eggs-12,     outcome: moved_to_next_order }
        - { to: ben, about: white-bread, outcome: cancel_too_late }

  - id: timing-cancel-frees-stock-035
    title: Cancelling before cutoff costs nothing and frees stock for the next in line
    policy: [R9.2, R3.4, R5.4]
    severity: major
    setup:
      catalog:
        - { sku: oat-milk-1l, name: "Oat Milk 1L", category: milk, price: 4.49, unit: 1L, stock: 2 }
      households:
        - id: ana
          requests: [{ text: "2 oat milk", added_at: "2026-11-14T09:00:00" }]
        - id: ben
          settings: { substitutions: not_allowed }
          requests: [{ text: "oat milk", added_at: "2026-11-14T09:30:00" }]
      events:
        - { at: "2026-11-14T12:00:00", household: ana, action: cancel, about: oat-milk-1l }
    expected:
      line_items:
        ana: []
        ben: [{ sku: oat-milk-1l, qty: 1 }]      # gets it now that ana is out
      subtotals:
        ana: 0.00
      final_notifications_exclude:
        - { to: ben, outcome: dropped }          # ben must not end up told "none left"

  - id: timing-order-once-036
    title: Retrying "place order" never creates a second order or a second charge
    policy: [R9.4, R5.4]
    severity: critical
    setup:
      households:
        - { id: ana, resolved_subtotal: 40.00 }
        - { id: ben, resolved_subtotal: 20.00 }
      events:
        - { at: "2026-11-14T18:00:00", action: place_order }
        - { at: "2026-11-14T18:00:05", action: place_order, note: "retry after timeout" }
    expected:
      store_orders_count: 1
      charge_attempts:
        ana: 1
        ben: 1
      charges:
        ana: { subtotal: 40.00, delivery: 5.00, service: 2.00, total: 47.00 }
        ben: { subtotal: 20.00, delivery: 4.99, service: 1.00, total: 25.99 }
      invariants:
        - sum(charges.total) == order.total     # 72.99

# ---------------------------------------------------------------------
# LLM-judge rubrics: used only for wording, never for whether the action
# was right (code checks decide that).
# ---------------------------------------------------------------------
rubrics:
  notification_quality:
    pass_if_all:
      - Names the original item the household asked for
      - Says clearly what happened (substituted / dropped / reduced / held / defaulted)
      - If substituted, names the substitute and any price difference
      - Tells the household what they can do next, if anything
      - Does not mention other households or their items (R7.1)
  confirmation_quality:
    pass_if_all:
      - States the quantity the household entered
      - Asks a clear yes/no question (or offers a corrected quantity)
      - Says the item is on hold until they reply, and what happens at cutoff
      - Not accusatory ("did you mean...", not "you made a mistake")
  clarification_quality:
    pass_if_all:
      - Lists the real options from the catalog, with size and price
      - Asks one question, short enough to answer in a tap
      - Says what happens if they don't answer before the deadline (R1.3)

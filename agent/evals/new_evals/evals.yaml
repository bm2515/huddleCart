  - id: money-price-change-030
    title: Checkout price is charged; a jump over 15% is flagged to the household
    policy: [R5.5, R5.4]
    severity: major
    setup:
      catalog:
        - { sku: butter-1lb,  name: "Butter 1lb",       category: dairy, price: 5.00, unit: 1lb,  stock: 20 }
        - { sku: white-bread, name: "White Bread Loaf", category: bread, price: 3.00, unit: loaf, stock: 30 }
      price_changes:
